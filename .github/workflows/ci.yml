name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  setup-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: corepack prepare pnpm@11.20.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
